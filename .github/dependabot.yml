# Weekly dependency update PRs, matching Redux and Redux_GUI. Without this, version bumps
# (including security fixes such as next 16.3.6) only arrive when someone updates by hand.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Next.js refuses to build unless react and react-dom are the exact same version, so
      # they must always move together in one PR.
      react:
        patterns:
          - "react"
          - "react-dom"
    ignore:
      # eslint-config-next's plugins and parser don't support ESLint 10 yet (lint crashes with
      # "scopeManager.addGlobals is not a function"). Remove this once eslint-config-next does.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

# CodeQL security scanning for the frontend's JavaScript and its GitHub Actions workflows. Results
# show up under the repository's Security tab and as checks on pull requests.
#
# Only CodeQL runs here. Lint findings stay in the rbs check (ESLint) rather than being uploaded as
# code-scanning alerts, so the Security tab only lists security findings.
name: CodeQL

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  schedule:
    # Weekly, Monday 11:30 UTC, so new CodeQL queries also run against unchanged code.
    - cron: '30 11 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # JavaScript needs no build step for CodeQL (build-mode: none).
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
